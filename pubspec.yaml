name: magnet
description: "A minimal native torrent streaming player for authorized content."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  android_intent_plus: ^5.3.1
  libtorrent_flutter: ^2.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

# NOTE: the previous dependency_overrides pinned package_info_plus 8.3.1 and
# wakelock_plus 1.3.2 for Flutter 3.24. CI now builds with Flutter 3.38, where
# those pins conflict with media_kit_video and break wakelock during playback,
# so resolution is left to pub.

flutter:
  uses-material-design: true
