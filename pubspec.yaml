name: magnet
description: "A native torrent streaming player for authorized content."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  android_intent_plus: ^5.3.1
  # Keep the native bridge in this repository so stream lifetime and Android
  # networking fixes ship with the app instead of depending on a prebuilt
  # package binary we cannot patch.
  libtorrent_flutter:
    path: third_party/libtorrent_flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

# Magnet intake and the background service are handled by our own platform
# channel in android/app/src/main/kotlin, so no extra plugin is needed for
# receiving magnet: links or running a foreground service.

flutter:
  uses-material-design: true
