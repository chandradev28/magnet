name: Android build

on:
  push:
    branches: [main, full-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Cache patched Android native bridge
        uses: actions/cache@v4
        id: native-cache
        with:
          path: third_party/libtorrent_flutter/prebuilt/android/arm64-v8a
          key: libtorrent-android-arm64-v8a-r26d-${{ hashFiles('third_party/libtorrent_flutter/src/torrent_bridge.cpp', 'scripts/build_android_native.sh') }}

      - name: Build patched Android native bridge
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          chmod +x scripts/build_android_native.sh
          scripts/build_android_native.sh arm64-v8a

      - name: Verify patched native bridge is present
        run: test -s third_party/libtorrent_flutter/prebuilt/android/arm64-v8a/liblibtorrent_flutter.so

      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build arm64 release APK
        run: |
          flutter build apk --release \
            --split-per-abi \
            --build-number=${{ github.run_number }} \
            -PlibtorrentFlutterAbis=arm64-v8a \
            -PlibtorrentFlutterSkipDownload=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magnet-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
